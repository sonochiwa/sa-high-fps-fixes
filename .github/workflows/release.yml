name: Verified release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: windows-2022

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v6

      - name: Configure MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build Release Win32
        run: msbuild HighFpsFixes.sln /t:Rebuild /p:Configuration=Release /p:Platform=Win32

      - name: Package release
        id: package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
              throw "Release tag must contain a semantic version."
          }

          $expected = "# High FPS Fixes v$version"
          $iniHeader = (Get-Content Config\HighFpsFixes.ini -TotalCount 1)
          if ($iniHeader -ne $expected) {
              throw "Config\HighFpsFixes.ini declares '$iniHeader', expected '$expected'."
          }

          $archiveName = "HighFpsFixes-v$version.zip"
          $archive = Join-Path build $archiveName
          $checksum = "$archive.sha256"
          $stage = Join-Path build "release\HighFpsFixes-v$version"
          Remove-Item -LiteralPath $stage -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Path $stage -Force | Out-Null
          Copy-Item build\HighFpsFixes.asi, build\HighFpsFixes.ini -Destination $stage

          $readme = @(
              "High FPS Fixes v$version"
              ""
              "Corrects behavior in GTA San Andreas 1.0 US that the original game ties to"
              "the rendered frame rate, so swimming, vehicle physics, timers, HUD counters"
              "and effects behave above 30 FPS the way they were built to at 30 FPS."
              ""
              "Installation"
              ""
              "  1. Copy HighFpsFixes.asi and HighFpsFixes.ini into the game's scripts"
              "     directory."
              "  2. Start the game."
              ""
              "Requires GTA San Andreas 1.0 US (Hoodlum executable) and an ASI loader such"
              "as Silent's ASI Loader or Ultimate ASI Loader. Every fix has its own switch"
              "in HighFpsFixes.ini; the plugin recreates that file beside itself if it is"
              "missing. Remove both files to uninstall."
              ""
              "Source code: https://github.com/sonochiwa/sa-high-fps-fixes"
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
              (Join-Path $stage README.txt),
              $readme,
              [Text.UTF8Encoding]::new($false)
          )

          Compress-Archive -Path "$stage\*" -DestinationPath $archive -Force
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $archiveName" | Set-Content -LiteralPath $checksum -Encoding ascii

          # Build provenance attestation is not available to user-owned private
          # repositories, so it is skipped there and the notes say so.
          $attested = "${{ github.event.repository.private }}" -ne 'true'
          $notes = @(
              "High FPS Fixes corrects behavior in GTA San Andreas 1.0 US that the original"
              "game ties to the rendered frame rate, without imposing an FPS cap. Every fix"
              "has its own switch in ``HighFpsFixes.ini``, and behavior at 30 FPS is unchanged."
              ""
              "The README lists every fix, which of them have been checked in game and how to"
              "check the rest."
              ""
              "### Verifying the download"
              ""
              if ($attested) {
                  'The archive was built by GitHub Actions from tag `${{ github.ref_name }}`. Compare it with the published SHA-256 file or verify its signed build provenance:'
                  ""
                  '```text'
                  "gh attestation verify $archiveName -R $env:GITHUB_REPOSITORY"
                  '```'
              } else {
                  'The archive was built by GitHub Actions from tag `${{ github.ref_name }}`. Compare it with the published SHA-256 file:'
                  ""
                  '```text'
                  "certutil -hashfile $archiveName SHA256"
                  '```'
              }
          ) -join [Environment]::NewLine
          [IO.File]::WriteAllText(
              (Join-Path build release-notes.md),
              $notes,
              [Text.UTF8Encoding]::new($false)
          )

          "version=$version" >> $env:GITHUB_OUTPUT
          "archive=$archive" >> $env:GITHUB_OUTPUT
          "checksum=$checksum" >> $env:GITHUB_OUTPUT

      - name: Attest release archive
        if: ${{ !github.event.repository.private }}
        uses: actions/attest@v4
        with:
          subject-path: ${{ steps.package.outputs.archive }}

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" `
            "${{ steps.package.outputs.archive }}" `
            "${{ steps.package.outputs.checksum }}" `
            --verify-tag `
            --latest `
            --title "High FPS Fixes v${{ steps.package.outputs.version }}" `
            --notes-file build\release-notes.md
